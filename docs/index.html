<!doctype html>
<html lang="en">

<meta name="description" content="Peter Rabbit Hide &amp; Seek: find Peter hiding in a big garden before night falls. A browser game a kid made by talking to AI.">
<title>Peter Rabbit Hide &amp; Seek</title>

<style>
/* Layout: full-screen canvas garden, small HUD chips on top, one centred card for menus. Single deliberate look (sunny garden), same in any theme. */
:root{
  --leaf:#3f7d2c;
  --leaf-deep:#25501a;
  --paper:#fff8e8;
  --ink:#2d2416;
  --muted:#6e5f45;
  --carrot:#ee7f22;
  --sky:#ffd75e;
  --font-display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--leaf-deep);color:var(--ink);font-family:var(--font-body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.chip{background:rgba(255,248,232,.92);color:var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 rgba(0,0,0,.18);line-height:1.15}
.chip b{font-family:var(--font-display);font-weight:700;font-size:18px;display:block}
.chip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#right{display:flex;gap:8px;align-items:flex-start}
#mute{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:13px;min-height:36px}
#mute:focus-visible,.btn:focus-visible{outline:3px solid var(--carrot);outline-offset:2px}
#clock{flex:1;max-width:420px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
#bar{position:relative;width:100%;height:14px;border-radius:10px;background:linear-gradient(90deg,#ffe58a 0%,#ffc34d 50%,#f08a4b 66%,#8a4f8f 80%,#2a2f6e 92%,#0e1433 100%);box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 0 0 2px rgba(255,255,255,.5)}
#orb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 3px #fff8e8,0 0 14px 4px rgba(255,210,63,.8);transition:background .6s,box-shadow .6s}
#orb.moon{background:#e9eefc;box-shadow:0 0 0 3px #c9d3f2,0 0 14px 4px rgba(200,215,255,.7)}
#clockText{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
#clockText.hurry{color:#ffd0b0}

#msg{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:rgba(45,36,22,.82);color:#fff8e8;padding:8px 16px;border-radius:12px;font-weight:500;font-size:15px;text-align:center;
  opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
#msg.show{opacity:1}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(20,35,12,.38)}
#overlay[hidden]{display:none!important}
.card{background:var(--paper);color:var(--ink);border-radius:22px;max-width:460px;width:100%;padding:24px 24px 20px;box-shadow:0 8px 0 rgba(0,0,0,.22),0 20px 50px rgba(0,0,0,.35);max-height:calc(100% - 8px);overflow:auto;box-sizing:border-box}
.card h1{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;margin:0 0 4px;color:var(--leaf);text-wrap:balance}
.card h1 span{display:block;color:var(--carrot);font-size:24px;margin-top:4px}
.card h2{font-family:var(--font-display);font-weight:700;font-size:28px;margin:0 0 6px;color:var(--leaf);text-wrap:balance}
.card p{margin:8px 0;line-height:1.45;font-size:15px}
.card ul{margin:10px 0 14px;padding-left:20px;line-height:1.45;font-size:14.5px}
.card li{margin:4px 0}
.card .note{color:var(--muted);font-size:13px}
kbd{font-family:var(--font-display);font-weight:600;background:#fff;border:2px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:18px;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--leaf-deep)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.stat{background:#f3e8cc;border-radius:12px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

#touch{display:none}
@media (pointer:coarse), (any-pointer:coarse){
  #touch{display:block}
  #joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,248,232,.25);border:3px solid rgba(255,248,232,.55);z-index:4;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,248,232,.85)}
  #ebtn{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,248,232,.6);font:700 34px var(--font-display);color:var(--ink);z-index:4;touch-action:none}
  #ebtn.ready{background:#fff8e8;box-shadow:0 0 0 6px rgba(255,215,94,.8);animation:pulse .7s infinite alternate}
}
@keyframes pulse{to{transform:scale(1.08)}}
#closeX{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:3px solid #fff;cursor:pointer;font:900 22px var(--font-display);color:#fff;
  text-shadow:0 2px 3px rgba(0,0,0,.6);background:conic-gradient(#ff4d4d,#ffb13b,#ffe14d,#5fe08a,#4cc3ff,#a77bff,#ff4d4d);box-shadow:0 3px 0 rgba(0,0,0,.25)}
#closeX:hover{transform:rotate(90deg) scale(1.05);transition:transform .3s}
#closeX:focus-visible{outline:3px solid var(--carrot);outline-offset:2px}
#bye{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--leaf-deep);color:var(--paper);text-align:center;padding:16px}
#bye h2{font-family:var(--font-display);font-size:36px;margin:0}
#bye p{margin:0;font-size:18px}
@media (max-width:520px){
  .chip b{font-size:15px}
  #clockText{font-size:12px}
  .card h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){#ebtn.ready{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="chip"><b id="roundTxt">Round 1</b><small id="speedTxt">Peter ×1.22 your speed</small></div>
  <div id="clock">
    <div id="bar"><div id="orb"></div></div>
    <div id="clockText">3:00 until night</div>
  </div>
  <div id="right">
    <div class="chip"><b id="caughtTxt">0</b><small>caught</small></div>
    <button id="mute" class="chip" type="button" aria-label="Toggle sound">Sound on</button>
    <button id="closeX" type="button" title="Close Peter Rabbit" aria-label="Close the game" hidden>&#x2715;</button>
  </div>
</div>
<div id="msg"></div>

<div id="overlay"><div class="card" id="card"><h2>Planting the garden…</h2></div></div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button id="ebtn" type="button" aria-label="Catch Peter">E</button>
</div>

<script>

    ctx.globalAlpha = day; ctx.fillStyle = b.col;
    ell(ctx, b.x - 3 * f, b.y - 22, 3.5 * f + 0.5, 3); ell(ctx, b.x + 3 * f, b.y - 22, 3.5 * f + 0.5, 3);
    ctx.fillStyle = '#2d2416'; ctx.fillRect(b.x - 0.5, b.y - 25, 1, 6);
    ctx.globalAlpha = 1;
  }

  // dusk and night
  const sk = skyAt(p);
  if (sk[3] > 0.004) {
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, darkCv.width, darkCv.height);
    dctx.fillStyle = `rgba(${sk[0] | 0},${sk[1] | 0},${sk[2] | 0},${sk[3].toFixed(3)})`;
    dctx.fillRect(0, 0, darkCv.width, darkCv.height);
    if (night > 0) {
      dctx.globalCompositeOperation = 'destination-out';
      const ds = DARK_SCALE * zoom; dctx.setTransform(ds, 0, 0, ds, -cam.x * ds, -cam.y * ds);
      const hole = (x, y, r, a) => { const g = dctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, TAU); dctx.fill(); };
      hole(player.x, player.y - 16, 250, 0.95 * night);
      for (const l of lanterns) if (onScreen(l.x, l.y, 200)) hole(l.x, l.y - 40, 170, 0.85 * night);
      dctx.globalCompositeOperation = 'source-over';
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(darkCv, 0, 0, cv.width, cv.height);
    ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  }
  if (night > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lanterns) {
      if (!onScreen(l.x, l.y, 150)) continue;
      const g = ctx.createRadialGradient(l.x, l.y - 50, 0, l.x, l.y - 50, 110); g.addColorStop(0, `rgba(255,190,100,${0.32 * night})`); g.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y - 50, 110, 0, TAU); ctx.fill();
    }
    const fa = clamp((p - 0.66) / 0.15, 0, 1);
    if (fa > 0) for (const f of fireflies) {
      if (!onScreen(f.x, f.y, 10)) continue;
      const bl = Math.max(0, Math.sin(gt * 2.2 + f.ph)); if (bl < 0.05) continue;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 9); g.addColorStop(0, `rgba(230,255,120,${0.9 * bl * fa})`); g.addColorStop(1, 'rgba(230,255,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // catch prompt
  if (canCatch) {
    const sp = peter.spot;
    if (peter.state === 'hidden' && sp && sp.prop && sp.prop.top) drawEPrompt(sp.x, sp.prop.top - 30);
    else drawEPrompt(peter.x, peter.y - 62);
  }

  // rustle hints at the screen edge
  if (hints.length) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const h of hints) {
      const hx2 = (h.x - cam.x) * zoom, hy2 = (h.y - cam.y) * zoom;
      const cx = vw / 2, cy = vh / 2, a = Math.atan2(hy2 - cy, hx2 - cx), m = 48;
      const k = Math.min((vw / 2 - m) / Math.max(Math.abs(Math.cos(a)), 1e-4), (vh / 2 - m) / Math.max(Math.abs(Math.sin(a)), 1e-4));
      const px = cx + Math.cos(a) * k, py = cy + Math.sin(a) * k;
      ctx.globalAlpha = Math.min(1, h.t);
      ctx.fillStyle = 'rgba(45,36,22,0.75)'; circle(ctx, px, py, 22);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.fillStyle = '#fff8e8'; ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(20, -8); ctx.lineTo(20, 8); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#9fdc6a'; ell(ctx, px - 4, py - 2, 7, 3.5, -0.6); ell(ctx, px + 5, py + 3, 6, 3, 0.5);
      ctx.fillStyle = '#fff8e8'; ctx.font = '600 11px Fredoka, "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('rustle', px, py + 25);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------- main loop ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

setTimeout(() => {
  buildWorld(); buildGround(); buildGrid();
  state = 'menu'; snapCam(); menuCard();
}, 30);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
